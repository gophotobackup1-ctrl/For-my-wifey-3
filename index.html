<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Emma 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#ffd6e8,#fff0f6,#e6f7ff);
  font-family:'Poppins',sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.card{
  width:90%;
  max-width:420px;
  background:rgba(255,255,255,0.92);
  border-radius:25px;
  padding:25px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,0.15);
}

h1{
  font-family:'Pacifico',cursive;
  color:#ff4d6d;
  font-size:2.2rem;
  margin-bottom:10px;
}

p{
  font-size:0.95rem;
  color:#444;
  line-height:1.7;
}

button{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:#ff4d6d;
  color:white;
  font-size:1rem;
  cursor:pointer;
  transition:0.3s;
}
button:hover{
  transform:scale(1.05);
}

/* floating hearts */
.heart{
  position:fixed;
  bottom:-20px;
  font-size:20px;
  animation:float 6s linear infinite;
}
@keyframes float{
  to{transform:translateY(-110vh);opacity:0}
}

/* hug */
#hug{
  font-size:50px;
  cursor:pointer;
  margin-top:15px;
}
.signature{
  margin-top:15px;
  font-family:'Pacifico',cursive;
  color:#ff4d6d;
  font-size:1.3rem;
}
.hidden{display:none}
</style>
</head>

<body>

<div class="card">

  <h1 id="title">Hey babe 💗</h1>

  <p id="text">
    I made this just for you, Emma.<br><br>
    It’s nothing big…<br>
    just something soft,<br>
    something that feels a little like you.
  </p>

  <button onclick="next()">Tap here 💖</button>

  <div id="extra" class="hidden">
    <p id="extraText" style="margin-top:15px"></p>
  </div>

  <div id="hugBox" class="hidden">
    <div id="hug" onclick="hug()">🫂</div>
    <p id="hugText"></p>
  </div>

  <div id="sign" class="signature hidden">— pwkie</div>

</div>

<script>
let step = 0;

function next(){
  step++;

  if(step === 1){
    title.innerHTML = "Emma 💖";
    text.innerHTML = `
      You know…<br><br>
      you have this way of making everything<br>
      feel a little warmer.<br><br>
      Even the smallest moments feel special<br>
      when it’s you.
    `;
  }

  else if(step === 2){
    title.innerHTML = "babe… ✨";
    text.innerHTML = `
      I don’t always say it properly,<br>
      but I really like having you in my life.<br><br>
      You make things lighter,<br>
      easier,<br>
      and honestly… happier.
    `;
  }

  else if(step === 3){
    title.innerHTML = "just saying 💗";
    text.innerHTML = `
      If I had to choose<br>
      a favorite person to talk to,<br>
      laugh with,<br>
      or just sit quietly with…<br><br>
      it would still be you, babe.
    `;
  }

  else if(step === 4){
    title.innerHTML = "one small thing 🫂";
    text.innerHTML = `
      If you were here right now,<br><br>
      I’d probably just pull you closer<br>
      and not say anything at all.
    `;
    document.getElementById("hugBox").classList.remove("hidden");
  }

  else if(step === 5){
    title.innerHTML = "last thing 💖";
    text.innerHTML = `
      I’m really glad it’s you.<br><br>
      Out of everything,<br>
      it being you… just feels right.
    `;
    document.getElementById("sign").classList.remove("hidden");
  }
}

function hug(){
  document.getElementById("hugText").innerHTML = "come here babe 💗";
}

/* floating hearts */
setInterval(()=>{
  const h=document.createElement('div');
  h.className='heart';
  h.innerHTML='💗';
  h.style.left=Math.random()*100+'vw';
  h.style.animationDuration=4+Math.random()*3+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
},600);
</script>

</body>
</html>
